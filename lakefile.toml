name = "NormalizerLean"
version = "0.1.0"
defaultTargets = ["NormalizerLean"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "NormalizerLean"

[[lean_lib]]
name = "NormalizerDelta"

# The Comparator pairs Challenge.<Entry> / Solution.<Entry>, one per Palomar entry (see palomar/<entry>/comparator.json).
# Not in defaultTargets: the challenges are all `sorry`, and Comparator builds both modules itself.
[[lean_lib]]
name = "Challenge"
globs = ["Challenge.+"]

[[lean_lib]]
name = "Solution"
globs = ["Solution.+"]
