name = "NormalizerLean"
version = "0.1.0"
defaultTargets = ["NormalizerLean"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "NormalizerLean"

[[lean_lib]]
name = "NormalizerDelta"

# The Comparator pair (see Comparator/comparator.json). Not in defaultTargets: `Challenge` is all `sorry`,
# and Comparator builds both modules itself.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
