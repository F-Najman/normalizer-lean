sources:
- title: The normalizer of Γ₁(N) in PSL₂(ℝ)
  authors:
  - C. H. Kim
  - J. K. Koo
  type: article
  location: Comm. Algebra 28 (2000), 5303–5310
  relationship: formalizes
  note: The normalizer of ±Γ₁(N) for N ≠ 4.
- title: Normalizers of congruence groups in SL₂(ℝ) and automorphisms of lattices
  authors:
  - Shaul Zemel
  id: doi:10.1142/S1793042117500701
  type: article
  location: Int. J. Number Theory 13 (2017), 1275–1300; arXiv:1512.07547
  relationship: independently-proves
  note: 'Zemel''s Corollary 2.6 (with Proposition 1.9) determines the normalizer of Γ_Δ(N) for every N and Δ: it lies in Γ₀^{∗,σ}(N)
    = D_σ⁻¹Γ₀(N/σ²)⁺D_σ for his σ = σ_H, which divides h_Δ. This implies the generalized Newman bound and, for h_Δ = h(N),
    the inclusion Nor(Γ_Δ(N)) ≤ Nor(Γ₀(N)) and the index. The formal proofs were found independently; the author learned of
    the paper after this formalization was registered.'
