version: v0.4
project:
  name: Normalizers of Γ_Δ(N), Γ(N) and ±Γ₁(N)
  description: 'Formal statements and proofs, in Lean 4 with Mathlib, about the normalizers in SL₂(ℝ) of the groups Γ_Δ(N)
    between Γ₁(N) and Γ₀(N), and the quotients Nor(Γ)/Γ, the modular automorphism groups of the curves X_Δ(N): a generalization
    of Newman''s description of the normalizer to Γ_Δ(N); Nor(Γ(N)) = SL₂(ℤ), so the modular automorphism group of X(N) is
    SL₂(ℤ/N)/{±1}; and, for N ≠ 4, Nor(±Γ₁(N)) is generated by Γ₀(N) and the Atkin–Lehner elements, so X₁(N) has 2^ω(N) φ(N)/2
    modular automorphisms for N ≥ 3 (N = 4 is an exception). 34 theorems, no sorry, only the axioms propext, Classical.choice
    and Quot.sound.'
  authors:
  - Filip Najman
  responsible_maintainers:
  - Filip Najman
  license: Apache-2.0
