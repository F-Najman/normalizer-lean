version: v0.4
project:
  name: Modular automorphism counts in Table 1 for X_Δ(N)
  description: 'For each of the 42 rows of Table 1 in Filip Najman’s Automorphisms of the modular curves X_Δ(N), Lean verifies
    the diamond index [(ℤ/N)ˣ : Δ] and the order of the modular automorphism group Nor(Γ_Δ(N))/Γ_Δ(N). The modular counts
    in the two split entries are 6 at level 37 and 48 at level 63. The proof specializes the general normalizer index formula
    and verifies the finite computations in the Lean kernel. The result is stated as 1 theorem indexed by the table rows.'
