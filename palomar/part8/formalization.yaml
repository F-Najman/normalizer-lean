version: v0.4
project:
  name: 'Normalizers of congruence subgroups at mixed level: Γ_{H₁}(N₁) ∩ Γ_{H₂}(N₂)'
  description: 'Formal statements and proofs, in Lean 4 with Mathlib, about the normalizer in SL₂(ℝ) of Γ = Γ_{H₁}(N₁) ∩ Γ_{H₂}(N₂)
    for coprime N₁ and N₂, the group of the fibre product X_{H₁} ×_{X(1)} X_{H₂}, where H₁ ≤ SL₂(ℤ/N₁) is such that, at every
    p ∣ N₁, H₁ mod p fixes no line or H₁ mod p^{v_p(N₁)} lies in a split Cartan subgroup, and H₂ ≤ SL₂(ℤ/N₂) is arbitrary.
    Nor(Γ) ≤ Nor(Γ_{H₂}(N₂)); an element (det m)^{−1/2}·m of Nor(Γ_{H₂}(N₂)) normalizes Γ iff m mod N₁ normalizes H₁; and
    |Nor(Γ)/Γ| is [N(H₁) : H₁] times the number of classes of Nor(Γ_{H₂})/Γ_{H₂} whose determinant mod N₁ is the determinant
    of an element of the normalizer of H₁ in GL₂(ℤ/N₁). Explicit forms follow for Γ_Δ(N₂) (the class of an Atkin–Lehner involution
    w_Q contains an element of Nor(Γ) iff Q mod N₁ is such a determinant) and for H₂ of prime level fixing exactly one line;
    corollaries for Γ(N₁), Γ_ns⁺(p) and Γ_sp⁺(p); and an example: for the quaternion group Q₈ ≤ SL₂(F₇), the determinants
    are the squares, and Γ_{Q₈}(7) ∩ Γ₀(3) has 6 modular automorphisms, not 12, because the Fricke involution of X₀(3) does
    not lift. 18 theorems, no sorry, only the axioms propext, Classical.choice and Quot.sound.'
