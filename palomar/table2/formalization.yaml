version: v0.4
project:
  name: Normalizer indices in Table 2 for X_Δ(N)
  description: 'For each of the 28 rows of Table 2 in Filip Najman’s Automorphisms of the modular curves X_Δ(N), Lean verifies
    the diamond index [(ℤ/N)ˣ : Δ] and the index [Nor(Γ_Δ(N)) : Γ_Δ(N)]. Each listed normalizer extends beyond Nor(Γ₀(N)).
    The proof specializes the general normalizer index formula and verifies the finite computations in the Lean kernel. The
    result is stated as 1 theorem indexed by the table rows.'
