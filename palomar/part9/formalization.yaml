  relationship: formalizes
  note: 'Theorem 2.11: the maximal arithmetic subgroups of PSL₂(ℝ) are the conjugates of G_(1,N)+ (Γ₀(N)⁺ here) for squarefree
    N. It is maximal_commensurable_iff, stated in SL₂(ℝ) (see the divergences). The formal proof follows Duncan''s outline:
    Proposition 2.10 (a group commensurable with PSL₂(ℤ) stabilizes a cell, after Conway), then a conjugation that moves two
    lattices of the cell at maximal hyperdistance to L₁ and L_N. It works with integral matrices and p-adic valuations instead
    of lattices and trees, and uses the Smith normal form instead of the transitivity of Proposition 2.8. mem_commensurator_SL2ZR_iff
    implies Proposition 2.14 (a group commensurable with PSL₂(ℤ) consists of rational matrices up to scalars); its proof is
    different, from the conjugates of powers of the unipotent matrices. Numbering of arXiv v2.'
