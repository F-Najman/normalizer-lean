fidelity:
  divergences: 'The groups are subgroups of SL₂(ℝ), not of PSL₂(ℝ) as in Duncan''s Theorem 2.11. Γ₀(N)⁺ contains −1, and adjoining
    −1 to a group commensurable with SL₂(ℤ) keeps it commensurable, so the maximal such groups contain −1 and correspond to
    Duncan''s maximal arithmetic subgroups of PSL₂(ℝ); this translation is not formalized. Duncan''s "conjugates of G_(1,N)+"
    are read as the conjugates that are again commensurable with SL₂(ℤ): maximal_commensurable_iff states this condition,
    since a conjugate by an arbitrary element of SL₂(ℝ) need not be commensurable with SL₂(ℤ). Commensurability is Mathlib''s
    Subgroup.Commensurable, the strong sense used by Duncan (finite index in both groups). Rational matrices A enter as (det
    A)^{−1/2}·A, for integral A with det A > 0. Normalizers are taken in SL₂(ℝ). Theorem numbers of Duncan refer to arXiv:0810.1465v2.'
