version: v0.4
project:
  name: 'Helling''s theorem: the maximal subgroups of SL₂(ℝ) commensurable with SL₂(ℤ)'
  description: Formal statements and proofs, in Lean 4 with Mathlib, of Helling's theorem and of consequences for normalizers.
    A subgroup G ≤ SL₂(ℝ) is commensurable with SL₂(ℤ) if G ∩ SL₂(ℤ) has finite index in G and in SL₂(ℤ); Γ₀(N)⁺ is the group
    generated by the Atkin–Lehner elements of level N, and contains Γ₀(N). Every G commensurable with SL₂(ℤ) is conjugate
    into Γ₀(N)⁺ for some squarefree N, by (det A)^{−1/2}·A for an integral matrix A with det A > 0. For every N ≥ 1, Γ₀(N)⁺
    is commensurable with SL₂(ℤ), and for squarefree N it is maximal among such groups; so the maximal subgroups of SL₂(ℝ)
    commensurable with SL₂(ℤ) are the conjugates of the Γ₀(N)⁺, N squarefree, that are commensurable with SL₂(ℤ) (Duncan's
    Theorem 2.11, in SL₂(ℝ)), and Γ₀(4)⁺ is not maximal. The commensurator of SL₂(ℤ) in SL₂(ℝ) consists of the (det A)^{−1/2}·A.
    For every Γ commensurable with SL₂(ℤ), the normalizer of Γ in SL₂(ℝ) is commensurable with SL₂(ℤ), so Nor(Γ)/Γ is finite,
    and Nor(Γ) is conjugate into Γ₀(N)⁺ for some squarefree N. The proof is the argument with p-adic trees that Duncan attributes
    to Conway, with an integral matrix for each vertex and distances computed from p-adic valuations of determinants and of
    the gcd of the entries; the vertices and edges fixed at the different primes are glued with the Smith normal form. 9 theorems,
    no sorry, only the axioms propext, Classical.choice and Quot.sound.
