    proofs included, was written by AI agents.
fidelity:
  divergences: Normalizers are taken in SL₂(ℝ), not PSL₂(ℝ). If −1 ∉ Γ the quotient is twice the modular automorphism group,
    so X(N) and X₁(N) appear through ±Γ(N) and ±Γ₁(N). Rational matrices A enter as (det A)^{−1/2}·A; Parts 3, 4 and 6 also
    prove the description as the normalizer in GL₂⁺(ℚ) modulo Γ·ℚ^×. In the presentations [x, y] = x⁻¹y⁻¹xy. Theorem numbers
    of Dose–Lido–Mercuri refer to arXiv:2005.09009v2 and arXiv:2610.08998v1.
review:
  status: statements reviewed by the author; proofs machine-checked
  reviewers:
  - Filip Najman
  notes: Every definition and statement was reviewed by the author, and by AI reviewer agents, before it was frozen. Numerical
    cross-checks (scripts/check_*_statements.py and others) test the statements on small cases. Comparator checks each challenge
    against its solution, definitions included.
