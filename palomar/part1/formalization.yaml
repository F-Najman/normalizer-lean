sources:
- title: Conjugacy, genus, and class numbers
  authors:
  - Morris Newman
  type: article
  location: Math. Ann. 196 (1972), 198–217
  relationship: independently-proves
  note: 'Newman''s theorem: the normalizer of Γ₀(N) consists of the matrices of Newman''s form. The formal proof is a new,
    self-contained one: conjugation by a matrix of Newman''s form preserves Γ₀(N) by direct computation; a normalizing element
    is a real multiple of a primitive integral matrix, because the ℤ-span of Γ₀(N) is preserved; and that matrix has Newman''s
    form, prime by prime, by an argument on p-adic valuations (NormalizerLean/NewmanLocal.lean).'
- title: Hecke operators on Γ₀(m)
  authors:
  - A. O. L. Atkin
  - J. Lehner
  type: article
  location: Math. Ann. 185 (1970), 134–160
  relationship: background
  note: The Atkin–Lehner elements.
- title: The normalizer of Γ₀(N) in PSL(2, ℝ)
  authors:
  - M. Akbaş
  - D. Singerman
  type: article
  location: Glasgow Math. J. 32 (1990), 317–327
  relationship: other
  note: The formalization proves that one of the relations of their presentation fails in B(256).
- title: The group structure of the normalizer of Γ₀(N) after Atkin–Lehner
  authors:
  - F. Bars
  id: arXiv:math/0701636
  type: article
  location: Comm. Algebra 36 (2008), 2160–2170
  relationship: other
  note: The formalization proves that the presentations at levels 32, 64 and 128 define infinite groups, that completed presentations
    present B(32) and B(64), and that the presentation at level 256 presents B(256).
related_formalizations: []
status:
  scope: 'Only modular automorphisms are treated: the quotient Nor(Γ)/Γ of the normalizer in SL₂(ℝ). Results saying that every
    automorphism of a given modular curve is modular need algebraic geometry that Mathlib does not have, and are not formalized.
    B(N) is defined as a quotient group, not as a presented group; a presentation is stated as an isomorphism PresentedGroup
    … ≃* B N that sends each generator to a specified class.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
