status:
  scope: 'Only modular automorphisms are treated: the quotient Nor(Γ)/Γ of the normalizer in SL₂(ℝ). Results saying that every
    automorphism of a given modular curve is modular need algebraic geometry that Mathlib does not have, and are not formalized.
    The non-split curves, and X_sp⁺, are treated at prime level only.'
