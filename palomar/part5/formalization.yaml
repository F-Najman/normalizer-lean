version: v0.4
project:
  name: Modular automorphisms of Cartan modular curves of prime level
  description: 'Formal statements and proofs, in Lean 4 with Mathlib, about the normalizers in SL₂(ℝ) of the groups defining
    the split and non-split Cartan modular curves and their normalizer curves: for any level N, every element of the normalizer
    of a group containing Γ(N) is a rational matrix of a restricted form; X_sp(N) ≅ X₀(N²); X_sp(p) (p ≥ 5) and X_ns(p) (p
    odd) have exactly 2 modular automorphisms; X_sp⁺(p) (p ≥ 7) and X_ns⁺(p) (p ≥ 5) have none, and both bounds on p are sharp.
    17 theorems, no sorry, only the axioms propext, Classical.choice and Quot.sound.'
  authors:
  - Filip Najman
  responsible_maintainers:
  - Filip Najman
  license: Apache-2.0
