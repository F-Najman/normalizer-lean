  type: original-proof
  relationship: other
  note: The results on M_Δ, the finiteness of Nor(Γ_Δ(N))/Γ_Δ(N), the coset count and h_Δ are first presented with this formalization,
    by its author. No systematic literature search has been made, so whether these results, or equivalent ones, appear earlier
    in the literature is unknown. The description of the centre of GL₂⁺(ℚ), used for B₀(N), is standard.
